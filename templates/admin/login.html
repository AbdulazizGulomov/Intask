{% load static %}
<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | InTask</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --accent: #4f6ee6;
            --ink: #ffffff;
            --muted: #94a3b8;
            --border: #222222;
        }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            background: var(--bg);
            color: var(--ink);
            display: grid;
            place-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 48px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
        }

        .logo span {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px;
        }

        p {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-grp {
            text-align: left;
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--muted);
        }

        input {
            width: 100%;
            box-sizing: border-box;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo">
            <img src="{% static 'img/In_task.png' %}" alt="InTask">
            <span>InTask Admin</span>
        </div>
        <h1>Xush kelibsiz</h1>
        <p>Boshqaruv paneliga kirish uchun login va parolni kiriting</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-grp">
                <label>Login</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-grp">
                <label>Parol</label>
                <input type="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Kirish</button>
        </form>
    </div>
</body>

</html>
