{% load i18n %}
<!doctype html>
<html lang="">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% trans "Create Job" %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
    }

    .job-card {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #ffffff;
    }

    .upload-card {
      width: 100%;
      min-height: 180px;
      border: 2px dashed #d6dce8;
      border-radius: 18px;
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: 0.2s ease;
    }

    .upload-card:hover {
      border-color: #4f6df5;
      background: #f1f5ff;
    }

    .upload-plus {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #4f6df5;
      color: #ffffff;
      font-size: 32px;
      line-height: 42px;
      font-weight: 500;
    }

    .upload-title {
      font-weight: 600;
      color: #1f2937;
    }

    .upload-subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    .photo-preview {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .upload-card.has-image {
      border-style: solid;
      border-color: #d6dce8;
      background: #000000;
    }

    .upload-card.has-image .upload-plus,
    .upload-card.has-image .upload-title,
    .upload-card.has-image .upload-subtitle {
      display: none;
    }

    .photo-remove-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      border: 0;
      border-radius: 999px;
      width: 34px;
      height: 34px;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      font-size: 18px;
      line-height: 1;
      display: none;
    }

    .upload-card.has-image .photo-remove-btn {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #addPhotoBtn {
      border-radius: 999px;
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
    }

    .form-control,
    .form-select {
      border-radius: 10px;
      min-height: 42px;
    }

    textarea.form-control {
      min-height: 120px;
    }

    .btn {
      border-radius: 10px;
    }

    .money-input {
      font-weight: 500;
      letter-spacing: 0.4px;
    }

    .money-hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .location-status {
      font-size: 13px;
    }

    @media (max-width: 576px) {
      .container {
        padding-left: 14px;
        padding-right: 14px;
      }

      .upload-card {
        min-height: 160px;
      }
    }
  </style>
</head>

<body>

<div class="container py-4" style="max-width: 720px;">
  <h3 class="mb-3">{% trans "Create Job" %}</h3>

  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  <form method="post" enctype="multipart/form-data" class="card job-card p-3 shadow-sm" id="jobCreateForm">
    {% csrf_token %}

    <!-- TITLE -->
    <div class="mb-3">
      <label class="form-label">{% trans "Title" %}</label>
      <input name="title" class="form-control" required>
    </div>

    <!-- PHOTOS -->
    <div class="mb-3">
      <label class="form-label">{% trans "Job photo" %}</label>

      <div id="photoUploadArea" class="row g-3">

        <!-- Photo 1 -->
        <div class="col-md-6 photo-box" id="photoBox1">
          <label for="photo1" class="upload-card">
            <button type="button" class="photo-remove-btn" data-input="photo1" data-preview="preview1" data-box="photoBox1">×</button>
            <div class="upload-plus">+</div>
            <div class="upload-title">{% trans "Upload main photo" %}</div>
            <div class="upload-subtitle">{% trans "Click to choose image" %}</div>
            <img id="preview1" class="photo-preview" style="display:none;" alt="">
          </label>
          <input type="file" name="photo1" id="photo1" class="d-none" accept="image/*">
        </div>

        <!-- Photo 2 -->
        <div class="col-md-6 photo-box d-none" id="photoBox2">
          <label for="photo2" class="upload-card">
            <button type="button" class="photo-remove-btn" data-input="photo2" data-preview="preview2" data-box="photoBox2">×</button>
            <div class="upload-plus">+</div>
            <div class="upload-title">{% trans "Upload photo" %}</div>
            <div class="upload-subtitle">{% trans "Click to choose image" %}</div>
            <img id="preview2" class="photo-preview" style="display:none;" alt="">
          </label>
          <input type="file" name="photo2" id="photo2" class="d-none" accept="image/*">
        </div>

        <!-- Photo 3 -->
        <div class="col-md-6 photo-box d-none" id="photoBox3">
          <label for="photo3" class="upload-card">
            <button type="button" class="photo-remove-btn" data-input="photo3" data-preview="preview3" data-box="photoBox3">×</button>
            <div class="upload-plus">+</div>
            <div class="upload-title">{% trans "Upload photo" %}</div>
            <div class="upload-subtitle">{% trans "Click to choose image" %}</div>
            <img id="preview3" class="photo-preview" style="display:none;" alt="">
          </label>
          <input type="file" name="photo3" id="photo3" class="d-none" accept="image/*">
        </div>

        <!-- Photo 4 -->
        <div class="col-md-6 photo-box d-none" id="photoBox4">
          <label for="photo4" class="upload-card">
            <button type="button" class="photo-remove-btn" data-input="photo4" data-preview="preview4" data-box="photoBox4">×</button>
            <div class="upload-plus">+</div>
            <div class="upload-title">{% trans "Upload photo" %}</div>
            <div class="upload-subtitle">{% trans "Click to choose image" %}</div>
            <img id="preview4" class="photo-preview" style="display:none;" alt="">
          </label>
          <input type="file" name="photo4" id="photo4" class="d-none" accept="image/*">
        </div>

      </div>

      <button type="button" id="addPhotoBtn" class="btn btn-outline-primary btn-sm mt-3">
        + {% trans "Add another photo" %}
      </button>

      <div class="form-text mt-2">
        {% trans "Upload one photo first. You can add more photos if needed, up to 4." %}
      </div>
    </div>

    <!-- REGION + PROFESSION + TYPE -->
    <div class="row g-3">

      <div class="col-md-4">
        <label class="form-label">{% trans "Region" %}</label>
        <select name="region" class="form-select" required>
          <option value="">--</option>
          {% for k,v in regions %}
            <option value="{{ k }}">{{ v }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">{% trans "Profession" %}</label>
        <select name="profession" class="form-select" required>
          <option value="">--</option>
          {% for profession in professions %}
            <option value="{{ profession.id }}">{{ profession.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">{% trans "Job type" %}</label>
        <select name="job_type" class="form-select" required>
          <option value="">--</option>
          {% for k,v in job_types %}
            <option value="{{ k }}">{{ v }}</option>
          {% endfor %}
        </select>
      </div>

    </div>

    <!-- PAY -->
    <div class="row g-3 mt-3">

      <div class="col-md-4">
        <label class="form-label">{% trans "Currency" %}</label>
        <select name="pay_currency" id="payCurrency" class="form-select">
          {% for k,v in currencies %}
            <option value="{{ k }}">{{ v }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">{% trans "Minimum Pay" %}</label>
        <input
          name="pay_min"
          id="payMin"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          class="form-control money-input"
          placeholder="6 000 000"
        >
        <div class="money-hint">{% trans "Example" %}: 6 000 000</div>
      </div>

      <div class="col-md-4">
        <label class="form-label">{% trans "Maximum Pay" %}</label>
        <input
          name="pay_max"
          id="payMax"
          type="text"
          inputmode="numeric"
          autocomplete="off"
          class="form-control money-input"
          placeholder="8 000 000"
        >
        <div class="money-hint">{% trans "Example" %}: 8 000 000</div>
      </div>

    </div>

    <!-- PAY TEXT -->
    <div class="mt-2">
      <label class="form-label">{% trans "Pay text (optional)" %}</label>
      <input name="pay_text" id="payText" class="form-control" placeholder="6–8 mln so‘m">
    </div>

    <!-- DESCRIPTION -->
    <div class="mb-3 mt-3">
      <label class="form-label">{% trans "Description" %}</label>
      <textarea name="description" class="form-control" rows="4"></textarea>
    </div>

    <!-- CONTACT -->
    <div class="row g-3">
      <div class="col-md-12">
        <label class="form-label">{% trans "Contact phone" %}</label>
        <input name="contact_phone" class="form-control" placeholder="+998901234567">
      </div>
    </div>

    <!-- HIDDEN LOCATION VALUES -->
    <input type="hidden" id="lat" name="lat">
    <input type="hidden" id="lng" name="lng">

    <!-- LOCATION BUTTON -->
    <div class="mt-3">
      <button type="button" id="getLocationBtn" class="btn btn-outline-primary w-100">
        📍 {% trans "Use my current location" %}
      </button>
      <div id="locMsg" class="small text-muted location-status mt-2"></div>
    </div>

    <!-- BUTTONS -->
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-success" type="submit">{% trans "Save" %}</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:employer_home' %}">
        {% trans "Back" %}
      </a>
    </div>

  </form>
</div>

<script>
  // =====================================================
  // PHOTO UPLOAD PREVIEW
  // =====================================================
  let visiblePhotoCount = 1;
  const maxPhotos = 4;

  function bindPreview(inputId, imgId) {
    const input = document.getElementById(inputId);
    const img = document.getElementById(imgId);

    if (!input || !img) return;

    input.addEventListener("change", () => {
      const file = input.files && input.files[0];
      const box = input.closest(".photo-box");
      const card = box.querySelector(".upload-card");

      if (!file) {
        img.style.display = "none";
        img.removeAttribute("src");
        card.classList.remove("has-image");
        return;
      }

      const url = URL.createObjectURL(file);
      img.src = url;
      img.style.display = "block";
      card.classList.add("has-image");
    });
  }

  bindPreview("photo1", "preview1");
  bindPreview("photo2", "preview2");
  bindPreview("photo3", "preview3");
  bindPreview("photo4", "preview4");

  const addPhotoBtn = document.getElementById("addPhotoBtn");

  addPhotoBtn.addEventListener("click", () => {
    if (visiblePhotoCount >= maxPhotos) return;

    visiblePhotoCount++;

    const nextBox = document.getElementById("photoBox" + visiblePhotoCount);

    if (nextBox) {
      nextBox.classList.remove("d-none");
    }

    if (visiblePhotoCount >= maxPhotos) {
      addPhotoBtn.style.display = "none";
    }
  });

  document.querySelectorAll(".photo-remove-btn").forEach((btn) => {
    btn.addEventListener("click", (event) => {
      event.preventDefault();
      event.stopPropagation();

      const input = document.getElementById(btn.dataset.input);
      const preview = document.getElementById(btn.dataset.preview);
      const box = document.getElementById(btn.dataset.box);
      const card = box.querySelector(".upload-card");

      input.value = "";
      preview.style.display = "none";
      preview.removeAttribute("src");
      card.classList.remove("has-image");
    });
  });

  // =====================================================
  // MONEY FORMATTER
  // 6000000 -> 6 000 000
  // Before submit: 6 000 000 -> 6000000
  // =====================================================
  function formatMoney(value) {
    value = value.replace(/\D/g, "");
    return value.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function unformatMoney(value) {
    return value.replace(/\s/g, "");
  }

  function shortMoneyText(value) {
    const numberValue = Number(unformatMoney(value));

    if (!numberValue) {
      return "";
    }

    if (numberValue >= 1000000) {
      const mln = numberValue / 1000000;
      return Number.isInteger(mln) ? mln + " mln" : mln.toFixed(1) + " mln";
    }

    if (numberValue >= 1000) {
      const ming = numberValue / 1000;
      return Number.isInteger(ming) ? ming + " ming" : ming.toFixed(1) + " ming";
    }

    return numberValue.toString();
  }

  function updatePayTextSuggestion() {
    const payMin = document.getElementById("payMin");
    const payMax = document.getElementById("payMax");
    const payText = document.getElementById("payText");
    const currency = document.getElementById("payCurrency");

    if (!payMin || !payMax || !payText || !currency) return;

    const minText = shortMoneyText(payMin.value);
    const maxText = shortMoneyText(payMax.value);

    if (!minText && !maxText) return;

    const currencyText = currency.value === "USD" ? "$" : "so‘m";

    if (minText && maxText) {
      payText.value = minText + " – " + maxText + " " + currencyText;
    } else if (minText) {
      payText.value = minText + " " + currencyText;
    } else if (maxText) {
      payText.value = maxText + " " + currencyText;
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    const moneyInputs = document.querySelectorAll(".money-input");

    moneyInputs.forEach((input) => {
      input.addEventListener("input", function () {
        this.value = formatMoney(this.value);
        updatePayTextSuggestion();
      });

      if (input.value) {
        input.value = formatMoney(input.value);
      }
    });

    const currency = document.getElementById("payCurrency");
    if (currency) {
      currency.addEventListener("change", updatePayTextSuggestion);
    }

    const form = document.getElementById("jobCreateForm");

    if (form) {
      form.addEventListener("submit", function () {
        moneyInputs.forEach((input) => {
          input.value = unformatMoney(input.value);
        });
      });
    }
  });

  // =====================================================
  // GEOLOCATION
  // Latitude and Longitude are hidden, but values are saved
  // =====================================================
  const btn = document.getElementById("getLocationBtn");
  const lat = document.getElementById("lat");
  const lng = document.getElementById("lng");
  const msg = document.getElementById("locMsg");

  btn.addEventListener("click", () => {
    if (!navigator.geolocation) {
      msg.textContent = "Geolocation not supported";
      return;
    }

    btn.disabled = true;
    msg.textContent = "Getting location...";

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lat.value = pos.coords.latitude.toFixed(6);
        lng.value = pos.coords.longitude.toFixed(6);
        msg.textContent = "Location added successfully";
        btn.disabled = false;
      },
      (err) => {
        msg.textContent = "Location error: " + err.message;
        btn.disabled = false;
      }
    );
  });
</script>

</body>
</html>
