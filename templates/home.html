{% extends "base.html" %}

{% block content %}
<div class="row gx-0">
    <!-- LEFT FILTER PANEL -->
    <div class="col-lg-3 px-4">
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
            <div class="card-body">
                <h5 class="fw-semibold mb-3">Filtrlar</h5>

                <div class="mb-3">
                    <strong class="text-secondary">Hudud</strong>
                    <div class="form-check ms-2">
                        <input class="form-check-input" type="checkbox" checked id="city1">
                        <label class="form-check-label" for="city1">Toshkent</label>
                    </div>
                    <div class="form-check ms-2">
                        <input class="form-check-input" type="checkbox" id="city2">
                        <label class="form-check-label" for="city2">Samarqand</label>
                    </div>
                    <!-- qo'shimcha hududlar -->
                </div>

                <div class="mb-3">
                    <strong class="text-secondary">Ish turi</strong>
                    <div class="form-check ms-2">
                        <input class="form-check-input" type="checkbox" checked id="type1">
                        <label class="form-check-label" for="type1">Doimiy</label>
                    </div>
                    <div class="form-check ms-2">
                        <input class="form-check-input" type="checkbox" id="type2">
                        <label class="form-check-label" for="type2">Vaqtinchalik</label>
                    </div>
                </div>

                <button class="btn btn-primary w-100">Qo‘llash</button>
            </div>
        </div>
    </div>

    <!-- RIGHT JOB LIST (cards) -->
    <div class="col-lg-9 px-4">
        <h4 class="fw-semibold mb-3">Tavsiya etilgan ishlar</h4>

        <!-- SAMPLE CARD 1 -->
        <div class="card border-0 shadow-sm mb-3" style="border-radius: 20px;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-medium mb-1">Elektrik usta</h5>
                    <div class="text-secondary small">
                        <span>📍 Toshkent</span> • <span>Doimiy</span>
                    </div>
                    <div class="small mt-1">
                        <span class="badge bg-light text-dark">💰 6–8 mln so‘m</span>
                    </div>
                </div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#authModal">Murojaat qilish</button>
            </div>
        </div>

        <!-- SAMPLE CARD 2 -->
        <div class="card border-0 shadow-sm mb-3" style="border-radius: 20px;">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="fw-medium mb-1">Omborchi</h5>
                    <div class="text-secondary small">
                        <span>📍 Buxoro</span> • <span>Doimiy</span>
                    </div>
                    <div class="small mt-1">
                        <span class="badge bg-light text-dark">💰 5 mln so‘m+</span>
                    </div>
                </div>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#authModal">Murojaat qilish</button>
            </div>
        </div>

        <!-- ko'p kartalar -->
    </div>
</div>

{% include "auth_modal.html" %}
{% endblock %}
